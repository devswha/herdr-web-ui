name: Windows install
# The real installer on a clean Windows PC: herdr's and Bun's own installers, herdr's plugin build,
# the app's first start, and an update. CI's "Native Windows install" job checks install.ps1's
# decisions against stand-ins and downloads, builds and starts nothing.
#
# Every run validates the checked-out commit. Scheduled/manual runs additionally exercise latest
# and previous fork releases only when readable stable releases exist. Prerequisite skips are
# reported separately, never counted as exercised release installation.
on:
  pull_request:
    paths:
      - 'install.ps1'
      - 'herdr-plugin.toml'
      - 'scripts/plugin.ps1'
      - 'scripts/plugin.ts'
      - 'scripts/preflight.ps1'
      - 'scripts/windows-install-e2e.ps1'
      - 'scripts/windows-release-prerequisites.ts'
      - 'server/managed.ts'
      - 'server/supervisor.ts'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - '.github/workflows/windows-install.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-install-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  install:
    name: Real Windows install
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # a pull request's default checkout is its merge with main: install.ps1 would be one commit and -Ref another
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      # no setup-bun: a PC that has neither herdr nor Bun is the case under test
      - name: Install this commit (independent of release availability)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: powershell
        run: |
          # A runner-local source fixture also works for a private repo or an unmerged PR SHA.
          # The plugin's recorded origin remains canonical; only Git transport is redirected.
          $key = "url.$($env:GITHUB_WORKSPACE.Replace('\', '/')).insteadOf"
          git config --global --add $key 'https://github.com/tomrutsaert/herdr-web-ui.git'
          try {
            & scripts/windows-install-e2e.ps1 -Ref $env:HEAD_SHA -Fresh
            if ($LASTEXITCODE -ne 0) { throw 'Current-commit Windows installation failed' }
          } finally { git config --global --unset-all $key }
          "$env:USERPROFILE\.bun\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure read-only Git authentication for fork release scenarios
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git --hostname github.com
      - name: Check optional fork release prerequisites
        id: releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/windows-release-prerequisites.ts
      - name: Install the latest readable fork release
        if: github.event_name != 'pull_request' && steps.releases.outputs.latest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.releases.outputs.latest }}
        # Use the checked-out installer, not an anonymous raw URL for a private repository.
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-install-e2e.ps1 -Ref $env:LATEST
      - name: Update from the previous readable fork release
        if: github.event_name != 'pull_request' && steps.releases.outputs.previous != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.releases.outputs.latest }}
          PREVIOUS: ${{ steps.releases.outputs.previous }}
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows-install-e2e.ps1 -Ref $env:PREVIOUS -LatestRelease $env:LATEST -Update
