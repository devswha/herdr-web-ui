id = "devswha.herdr-web-ui"
name = "herdr web ui"
version = "0.3.15"
min_herdr_version = "0.9.0"
description = "Browser and phone client for herdr: chat and live terminal for every agent pane, remote PCs over SSH, web push alerts"
platforms = ["linux", "macos"]

# what is missing, in one line, before `bun install` would fail some steps later
[[build]]
command = ["sh", "scripts/preflight.sh"]

[[build]]
command = ["bun", "install"]

[[build]]
command = ["bun", "run", "build"]

# One-shot per herdr start: brings the bridge up if it is not already answering.
[[startup]]
command = ["bun", "scripts/plugin.ts", "start"]

[[actions]]
id = "start"
title = "Start herdr web ui"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "start"]

[[actions]]
id = "stop"
title = "Stop herdr web ui"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "stop"]

[[actions]]
id = "status"
title = "herdr web ui status"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "status"]

# a pairing code for a phone, printed in the terminal: a headless PC has no browser to show one in
[[actions]]
id = "pair"
title = "Pair a device with herdr web ui"
contexts = ["workspace"]
command = ["bun", "scripts/plugin.ts", "pair"]
